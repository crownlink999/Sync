<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Основные сводки</title>
<meta name="theme-color" content="#0b3d2e">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f1;--card:#fff;--line:#e3e8e1;--ink:#14231c;--mut:#5f6f66;--dim:#8a978f;
  --em:#0f6b4f;--em2:#12805c;--deep:#0b3d2e;--gold:#c98a12;--gold2:#f0c35a;
  --good:#12805c;--bad:#d1432f;--warn:#c98a12;--blue:#2f6fb3;--violet:#7a5bb5;
  --goodbg:#e3f4ec;--badbg:#fbe7e3;--warnbg:#fcf1d9;--bluebg:#e5eef8;
  --r:18px;--sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sh:0 1px 2px rgba(20,35,28,.05),0 10px 26px -16px rgba(20,35,28,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}
#app{max-width:980px;margin:0 auto;padding:0 14px 20px}

/* ---------- обложка ---------- */
#cover{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:space-between;padding:calc(28px + env(safe-area-inset-top)) 24px calc(26px + env(safe-area-inset-bottom));
  color:#eaf5ee;background:radial-gradient(120% 90% at 85% 8%,#1b8a65 0,#0f5a43 38%,#0b3d2e 70%,#082a20 100%);overflow:hidden;transition:opacity .45s,transform .45s}
#cover.out{opacity:0;transform:scale(1.04);pointer-events:none}
#cover:before{content:"";position:absolute;right:-120px;top:-120px;width:380px;height:380px;border-radius:50%;border:1px solid rgba(240,195,90,.28);box-shadow:0 0 0 38px rgba(240,195,90,.05),0 0 0 90px rgba(240,195,90,.03)}
.cv-top{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#cfe3d6;position:relative}
.cv-mid{position:relative}
.cv-h{font-size:clamp(38px,12vw,64px);line-height:1;font-weight:800;letter-spacing:-1px;margin:6px 0 10px}
.cv-h b{background:linear-gradient(180deg,#fbe9b1,#e2b64f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.cv-s{color:#bfd8c9;font-size:15px;max-width:420px}
.cv-kpis{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.cv-k{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:10px 14px;min-width:104px;backdrop-filter:blur(6px)}
.cv-k i{display:block;font-style:normal;font-size:11px;color:#bfd8c9;letter-spacing:.4px}
.cv-k b{font-size:20px}
.cv-k small{font-size:12px;margin-left:4px}
.cv-btn{position:relative;border:0;border-radius:16px;padding:16px;font-weight:800;font-size:16px;color:#1e2a12;background:linear-gradient(180deg,#f6d77e,#e0b04a);box-shadow:0 14px 28px -12px rgba(0,0,0,.55)}
.cv-art{position:absolute;right:6px;bottom:96px;width:min(64vw,340px);opacity:.9;pointer-events:none}

/* ---------- шапка ---------- */
.top{position:sticky;top:0;z-index:20;margin:0 -14px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(243,245,241,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.3px}.brand b{color:var(--em)}
.sp{flex:1}
.dstep{display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--sh)}
.dstep button{border:0;background:transparent;width:30px;height:30px;border-radius:50%;font-size:17px;color:var(--em);font-weight:800}
.dstep button:disabled{opacity:.25}
.dstep span{font-weight:700;font-size:13.5px;padding:0 6px;min-width:96px;text-align:center}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(18,128,92,.15)}

/* ---------- карточки ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:14px 0;box-shadow:var(--sh)}
.card h3{font-size:15px;font-weight:800}
.card .sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.sec{display:flex;align-items:center;gap:10px;margin:24px 2px 4px;font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut)}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.grid.g3{grid-template-columns:repeat(3,1fr)}.grid.g4{grid-template-columns:repeat(4,1fr)}.grid.g2w{grid-template-columns:repeat(2,1fr)}}
.kc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 13px 11px;box-shadow:var(--sh);text-align:left;position:relative;overflow:hidden}
.kc:active{transform:scale(.985)}
.kc .nm{font-size:12px;font-weight:700;color:var(--mut);display:flex;justify-content:space-between;gap:6px}
.kc .big{font-size:25px;font-weight:800;letter-spacing:-.6px;margin:3px 0 0}
.kc .big small{font-size:12px;color:var(--dim);font-weight:600;margin-left:3px}
.kc .pl{font-size:12px;color:var(--mut)}
.chip{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px}
.chip.g{background:var(--goodbg);color:var(--good)}.chip.b{background:var(--badbg);color:var(--bad)}.chip.w{background:var(--warnbg);color:#9a6a08}.chip.n{background:#edf0ec;color:var(--mut)}
.bar{height:7px;border-radius:99px;background:#e9eee8;overflow:hidden;margin-top:8px;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--em2)}
.bar.bad i{background:var(--bad)}.bar.warn i{background:var(--gold)}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.kc .mt{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:5px}
.spark{display:block;width:100%;height:34px;margin-top:6px}

/* ---------- внимание ---------- */
.al{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.al:first-of-type{border-top:0}
.al .ic{flex:0 0 28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px}
.al.b .ic{background:var(--badbg);color:var(--bad)}.al.w .ic{background:var(--warnbg);color:#9a6a08}.al.i .ic{background:var(--bluebg);color:var(--blue)}.al.g .ic{background:var(--goodbg);color:var(--good)}
.al b{font-weight:700}.al div{font-size:13.5px}.al .s{font-size:12px;color:var(--mut);margin-top:1px}

/* ---------- таблицы ---------- */
.tw{overflow-x:auto;margin:10px -4px 0;padding:0 4px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;font-weight:800;color:var(--mut);text-align:right;padding:7px 8px;border-bottom:2px solid var(--line);white-space:nowrap;letter-spacing:.2px;background:#fafbf9;position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
th:first-child{background:#fafbf9}
td{padding:8px 8px;border-bottom:1px solid #eef1ec;text-align:right;white-space:nowrap}
tr.clk{cursor:pointer}tr.clk:active td{background:#f5f8f4}
td.nm{font-weight:700;white-space:normal;min-width:130px;max-width:210px}
.hl td{background:#fff8e6!important}
.ph th{background:#e8f1ec;color:var(--deep);text-align:center;border-bottom:1px solid #cfe0d6}

/* ---------- чипы/переключатели ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;margin:8px -2px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.cp{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--mut)}
.cp.on{background:var(--deep);border-color:var(--deep);color:#fff}
.seg{display:inline-flex;background:#e9eee8;border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:10px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--deep);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---------- графики ---------- */
.ch{position:relative;margin-top:8px}
.ch svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.ch text{font-family:var(--sans);font-size:11px;fill:var(--dim)}
.tip{position:absolute;pointer-events:none;background:rgba(20,35,28,.95);color:#fff;border-radius:11px;padding:8px 10px;font-size:12px;line-height:1.35;min-width:130px;z-index:5;display:none;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.tip b{display:block;margin-bottom:2px;font-size:12.5px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- горизонтальные бары ---------- */
.hb{display:grid;grid-template-columns:minmax(112px,1.3fr) 3fr auto;gap:8px;align-items:center;padding:6px 0;font-size:13px;cursor:default}
.hb .t{font-weight:600;line-height:1.2}
.hb .t small{display:block;color:var(--dim);font-weight:500;font-size:11.5px}
.hb .tr{height:12px;background:#eef1ec;border-radius:99px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:99px;background:var(--em2)}
.hb.hot .tr i{background:var(--bad)}.hb.hot .t{color:var(--bad)}
.hb .v{font-weight:800;text-align:right}
.hb .v small{display:block;font-weight:600;color:var(--mut);font-size:11.5px}

/* ---------- парогенераторы ---------- */
.ugrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));margin-top:10px}
.u{border-radius:14px;padding:8px 9px;border:1px solid var(--line);background:#fff;text-align:left}
.u b{display:block;font-size:12px}.u .p{font-size:18px;font-weight:800;line-height:1.15}.u .d{font-size:11px;color:var(--mut)}
.u.ok{background:var(--goodbg);border-color:#bfe3d1}.u.mid{background:var(--warnbg);border-color:#f0d9a2}.u.low{background:#fdeadf;border-color:#f3c3a8}.u.off{background:var(--badbg);border-color:#f2b9b0}
.u .bd{height:5px;background:rgba(0,0,0,.08);border-radius:9px;margin-top:5px;overflow:hidden}.u .bd i{display:block;height:100%;background:currentColor;opacity:.75}
.u.ok{color:var(--good)}.u.mid{color:var(--warn)}.u.low{color:#c4621c}.u.off{color:var(--bad)}
.u b,.u .p,.u .d{color:var(--ink)}.u .d{color:var(--mut)}

/* ---------- нижнее меню ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.nav .in{display:flex;max-width:760px;width:100%;gap:2px}
.nav button{flex:1;border:0;background:transparent;border-radius:14px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--dim)}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--em);background:var(--goodbg)}

/* ---------- шторка ---------- */
#bk{position:fixed;inset:0;background:rgba(10,25,18,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
#bk.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 14px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-width:980px;margin:0 auto}
#sheet.on{transform:none}
#sheet .grab{width:44px;height:5px;border-radius:9px;background:#cdd5cc;margin:4px auto 10px}
#sheet .x{position:absolute;right:12px;top:12px;border:0;background:#e6ebe5;width:32px;height:32px;border-radius:50%;font-size:16px}
.note{font-size:12px;color:var(--dim);margin-top:8px}
.pill{display:inline-block;font-size:11px;font-weight:700;background:#e9eee8;color:var(--mut);border-radius:8px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.empty{padding:30px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div id="cover">
  <div class="cv-top">АО «Каражанбасмунай» · ЦИТС</div>
  <svg class="cv-art" viewBox="0 0 340 220" fill="none" stroke="#f0c35a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
    <path d="M20 200h300"/><path d="M120 200l30-90 30 90M135 160h30M127 180h46"/>
    <path d="M60 96l150-26"/><path d="M210 70l30 24-12 20"/><circle cx="60" cy="96" r="10"/>
    <path d="M60 96v-22M60 74l18-8" /><path d="M228 114v60M222 174h12"/>
    <circle cx="150" cy="106" r="7"/><path d="M270 200v-38M270 162l14-8M284 154v8"/>
  </svg>
  <div class="cv-mid">
    <div class="cv-top" id="cvDate">…</div>
    <div class="cv-h">Основные<br><b>сводки</b></div>
    <div class="cv-s">Добыча, сдача, простои, ППД и пар — план, факт и отклонение на одном экране.</div>
    <div class="cv-kpis" id="cvK"></div>
  </div>
  <button class="cv-btn" id="cvGo">Открыть дашборд</button>
</div>

<div id="app" hidden>
  <div class="top"><div class="row">
    <div class="brand">Основные <b>сводки</b></div><div class="sp"></div>
    <div class="dstep"><button id="dPrev" aria-label="Назад">‹</button><span id="dLbl">—</span><button id="dNext" aria-label="Вперёд">›</button></div>
  </div></div>
  <main id="view"></main>
</div>

<nav class="nav" id="nav" hidden><div class="in"></div></nav>
<div id="bk"></div>
<div id="sheet"><div class="grab"></div><button class="x" id="shX">✕</button><div id="shB"></div></div>

<script>
/* ======================= утилиты ======================= */
const $=(s,e=document)=>e.querySelector(s);
const fmt=(n,d=0)=>n==null||isNaN(n)?'—':Number(n).toLocaleString('ru-RU',{maximumFractionDigits:d,minimumFractionDigits:d}).replace(/ /g,' ');
const sgn=(n,d=0)=>n==null||isNaN(n)?'—':(n>0.0001?'+':n<-0.0001?'−':'')+fmt(Math.abs(n),d);
const sum=a=>a.reduce((s,x)=>s+(typeof x==='number'?x:0),0);
const pct=(a,b)=>b?a/b*100:null;
const MR=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const C={fact:'#0f7a5a',plan:'#c98a12',blue:'#2f6fb3',bad:'#d1432f',violet:'#7a5bb5',teal:'#16a3a3',grey:'#9aa79f'};
const cleanL=s=>(s||'').replace(/\/+\s*$/,'').replace(/\s*\|\s*/g,' · ').trim();
let D=null, S={tab:'home',day:null,cm:null,shift:0};
const last=a=>a&&a.length?a[a.length-1]:null;
const at=(a,i)=>a&&i>=0&&i<a.length?a[i]:null;
function cls(dev,inv){ if(dev==null) return 'n'; const v=inv?-dev:dev; return v>0.0001?'g':v<-0.0001?'b':'n'; }
function chip(dev,txt,inv){ const c=cls(dev,inv); return `<span class="chip ${c}">${txt}</span>`; }
const NOW=()=>D.meta;
const curM=()=>D.meta.month;

/* ======================= расчёты ======================= */
function arr(key,m){ return (D.series[key].daily||{})[m]||[]; }
function K(key,d){            // показатели на выбранный день d текущего месяца
  const s=D.series[key],M=curM(),a=arr(key,M),sm=D.summary[key],dd=D.meta.day;
  const dayPlan=s.dayPlan[M]; const fact=at(a,d-1);
  const mtdFact=sum(a.slice(0,d)), mtdPlan=(dayPlan||0)*d;
  const shift=(dd-d)*(dayPlan||0);
  let ytdFact=sm.ytdFact-sum(a.slice(d,dd)), ytdPlan=sm.ytdPlan-shift;
  return {key,name:s.name,unit:s.unit,dayFact:fact,dayPlan,mtdFact,mtdPlan,mtdDev:mtdFact-mtdPlan,monthPlan:s.monthPlan[M],
          yearPlan:sm.yearPlan,ytdFact,ytdPlan,ytdDev:ytdFact-ytdPlan,series:a};
}
function idleCause(m,name,inj){ const L=(inj?D.idleInj:D.idleProd)[m]||[]; return L.find(c=>c.l.toLowerCase().startsWith(name.toLowerCase())); }
function idleTotal(m,i){ const L=D.idleProd[m]||[]; return sum(L.filter(c=>!/^ИТОГО|^Из них/i.test(c.l)).map(c=>at(c.w,i))); }
function idleTotalQ(m,i){ const L=D.idleProd[m]||[]; return sum(L.filter(c=>!/^ИТОГО|^Из них/i.test(c.l)).map(c=>at(c.q,i))); }
function fp(k,m){ return (D.fundProd[m]||{})[k]||[]; }
function inj(m,sub){ const L=D.inj[m]||[]; return L.filter(r=>r.l.toLowerCase().includes(sub.toLowerCase())); }
function injRow(m,sub){ return inj(m,sub)[0]; }

/* ======================= графики ======================= */
const CH={}; let chN=0;
function niceTicks(min,max,n=4){ if(max===min){max=min+1}
  const span=max-min, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0))), r=step0/mag;
  const step=(r<1.5?1:r<3?2:r<7?5:10)*mag; const a=Math.floor(min/step)*step, b=Math.ceil(max/step)*step; const t=[]; for(let v=a;v<=b+step/2;v+=step) t.push(+v.toFixed(6)); return t; }
function chart(o){
  const id='ch'+(++chN), W=640, H=o.h||210, pl=o.pl||46, pr=8, pt=10, pb=24, iw=W-pl-pr, ih=H-pt-pb;
  const n=o.labels.length; if(!n) return '<div class="empty">Нет данных</div>';
  let vals=[]; o.series.forEach(s=>s.v.forEach(x=>{if(typeof x==='number')vals.push(x)}));
  let mn=Math.min(...vals), mx=Math.max(...vals); const hasBar=o.series.some(s=>s.t==='bar');
  if(o.min!=null)mn=o.min; else if(hasBar||o.zero)mn=Math.min(0,mn); else {const p=(mx-mn)*.18||1; mn-=p;}
  if(o.max!=null)mx=o.max; else {mx+= (mx-mn)*.08||1;}
  const tk=niceTicks(mn,mx,4); mn=tk[0]; mx=tk[tk.length-1];
  const X=i=>pl+(n===1?iw/2:(i+.5)*iw/n), Y=v=>pt+ih-(v-mn)/(mx-mn)*ih;
  let g='';
  tk.forEach(t=>{ g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="#e6ebe5"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end">${o.yf?o.yf(t):fmt(t)}</text>`; });
  const step=Math.ceil(n/(o.xt||10));
  o.labels.forEach((l,i)=>{ if(i%step===0||i===n-1) g+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${l}</text>`; });
  const bars=o.series.filter(s=>s.t==='bar'), bw=Math.min(26,iw/n*.68/Math.max(1,bars.length));
  o.series.forEach(s=>{
    if(s.t==='bar'){ const bi=bars.indexOf(s); s.v.forEach((v,i)=>{ if(typeof v!=='number')return; const x=X(i)-bw*bars.length/2+bi*bw; const y0=Y(0<mn?mn:0),y1=Y(v);
        const col=s.cf?s.cf(v,i):s.c; g+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${bw-1.5}" height="${Math.max(1,Math.abs(y0-y1))}" rx="3" fill="${col}" opacity="${s.o||1}"/>`; }); }
    else { let d='',first=true,pts=[]; s.v.forEach((v,i)=>{ if(typeof v!=='number'){first=true;return;} d+=(first?'M':'L')+X(i).toFixed(1)+' '+Y(v).toFixed(1); first=false; pts.push([X(i),Y(v)]); });
      if(s.t==='area'&&pts.length){ g+=`<path d="${d}L${pts[pts.length-1][0]} ${Y(mn)}L${pts[0][0]} ${Y(mn)}Z" fill="${s.c}" opacity=".12"/>`; }
      g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2.4}" ${s.dash?'stroke-dasharray="6 5"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
      if(n<=40&&!s.dash) pts.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="#fff" stroke="${s.c}" stroke-width="1.6"/>`); }
  });
  CH[id]={o,X,W,H,pl,iw,n};
  const lg=o.series.map(s=>`<span><i style="background:${s.c};${s.dash?'opacity:.6':''}"></i>${s.n}</span>`).join('');
  return `<div class="ch" id="${id}"><svg viewBox="0 0 ${W} ${H}"><g>${g}</g><line class="cx" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="#14231c" stroke-opacity=".35" style="display:none"/></svg><div class="tip"></div></div><div class="lg">${lg}</div>`;
}
function bindCharts(root=document){
  root.querySelectorAll('.ch').forEach(el=>{ const c=CH[el.id]; if(!c||el._b)return; el._b=1;
    const svg=el.querySelector('svg'), tip=el.querySelector('.tip'), cx=el.querySelector('.cx');
    const mv=e=>{ const r=svg.getBoundingClientRect(); const px=(e.touches?e.touches[0].clientX:e.clientX)-r.left; const vx=px/r.width*c.W;
      let i=Math.round((vx-c.pl)/c.iw*c.n-.5); i=Math.max(0,Math.min(c.n-1,i)); const x=c.X(i);
      cx.setAttribute('x1',x);cx.setAttribute('x2',x);cx.style.display='';
      const o=c.o; let h=`<b>${o.tl?o.tl(i):o.labels[i]}</b>`;
      o.series.forEach(s=>{ const v=s.v[i]; if(typeof v==='number') h+=`<div><i style="background:${s.c}"></i>${s.n}: <b style="display:inline">${o.vf?o.vf(v,s):fmt(v,s.d||0)}</b></div>`; });
      if(o.extra) h+=o.extra(i);
      tip.innerHTML=h; tip.style.display='block';
      const tw=tip.offsetWidth, left=Math.min(Math.max(4,x/c.W*r.width-tw/2),r.width-tw-4); tip.style.left=left+'px'; tip.style.top='-6px'; };
    const lv=()=>{tip.style.display='none';cx.style.display='none'};
    svg.addEventListener('mousemove',mv); svg.addEventListener('mouseleave',lv);
    svg.addEventListener('touchstart',mv,{passive:true}); svg.addEventListener('touchmove',mv,{passive:true}); svg.addEventListener('touchend',()=>setTimeout(lv,1400));
  });
}
function spark(vals,plan,col){ const v=vals.filter(x=>typeof x==='number'); if(v.length<2)return ''; const W=120,H=34;
  let mn=Math.min(...v,plan??Infinity),mx=Math.max(...v,plan??-Infinity); if(mx===mn)mx=mn+1; const p=(mx-mn)*.15; mn-=p;mx+=p;
  const X=i=>i/(vals.length-1)*W, Y=x=>H-(x-mn)/(mx-mn)*H; let d=''; vals.forEach((x,i)=>{ if(typeof x==='number') d+=(d?'L':'M')+X(i).toFixed(1)+' '+Y(x).toFixed(1); });
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${plan!=null?`<line x1="0" x2="${W}" y1="${Y(plan)}" y2="${Y(plan)}" stroke="${C.plan}" stroke-dasharray="4 3" stroke-width="1.4"/>`:''}<path d="${d}L${W} ${H}L0 ${H}Z" fill="${col}" opacity=".1"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`; }
function hbars(items,o={}){ // items:[{t,s,v,vs,hot}]
  const mx=Math.max(1,...items.map(i=>i.v)); return items.map(i=>`<div class="hb ${i.hot?'hot':''}"><div class="t">${i.t}${i.s?`<small>${i.s}</small>`:''}</div><div class="tr"><i style="width:${Math.max(i.v>0?2:0,i.v/mx*100)}%;${i.c?'background:'+i.c:''}"></i></div><div class="v num">${i.vt??fmt(i.v,o.d||0)}${i.vs?`<small>${i.vs}</small>`:''}</div></div>`).join(''); }

    out.push({t:nm.replace(/\s*\((замерная по скв\.?|по замеру скв\.?)\)\s*/i,'').replace(/^\s+/,''),zone:parts.length>1?parts[0].replace(/, м³/,''):'',q:at(r.v,i),pq:at(r.v,i-1),w:at(R[k+1].v,i),pw:at(R[k+1].v,i-1),s:at(R[k+2]?.v,i),ps:at(R[k+2]?.v,i-1)}); }
  return out; }

/* ======================= ПАР ======================= */
function unitClass(u){ if(!u.steam) return 'off'; const r=u.steam/u.nominal; return r>=.9?'ok':r>=.7?'mid':'low'; }
function vSteam(){
  const M=curM(), i=S.day-1, m=S.cm?.st??M, k=K('steam',S.day);
  const G=D.gens, ppg=G['ППГ'][M]||[], sp=G['СПГУ'][M]||[], mp=G['МПГУ'][M]||[];
  const dry=[{n:'ППГ',c:C.fact,t:'line',v:(G['ППГ'][m]||[])[1]?.v||[]},{n:'СПГУ',c:C.blue,t:'line',v:(G['СПГУ'][m]||[])[1]?.v||[]},{n:'МПГУ',c:C.violet,t:'line',v:(G['МПГУ'][m]||[])[1]?.v||[]}];
  const wa=(G['ППГ'][m]||[])[5]?.v||[], ww=(G['ППГ'][m]||[])[6]?.v||[];
  const U=D.today.units||[]; const filt=S.uf||'all';
  const shown=U.filter(u=>filt==='all'||(filt==='bad'&&(unitClass(u)==='off'||unitClass(u)==='low'||(u.dry&&u.dry<60)))||(filt==='mpgu23'&&u.kind==='МПГУ-23т')||(filt==='spgu'&&u.kind==='СПГУ-18тн')||(filt==='mpgu11'&&u.kind==='МПГУ-11тн'));
  const tot=D.today.ppgSpguTotals, ppg3=D.today.ppg3;
  const parts=[{t:'ППГ-3,4 (большие котлы)',v:at(ppg[0].v,i),c:C.fact},{t:'СПГУ-18тн',v:at(sp[0].v,i),c:C.blue},{t:'МПГУ-11тн',v:at(mp[0].v,i),c:C.violet}];
  const cnt={ok:0,mid:0,low:0,off:0}; U.forEach(u=>cnt[unitClass(u)]++);
  const sumU=sum(U.map(u=>u.steam)), nomU=sum(U.map(u=>u.nominal));
  return `<div class="sec">Закачка пара · ${S.day} ${MG[M-1]}</div>
  <div class="grid g3">${kcard('steam')}
   <div class="kc"><div class="nm">Скважин под паром (ППГ)</div><div class="big num">${at(ww,i)}<small>из ${at(wa,i)}</small></div><div class="pl">загрузка ${fmt(pct(at(ww,i),at(wa,i)),0)}% ${chip(at(ww,i)-at(ww,i-1),sgn(at(ww,i)-at(ww,i-1)))}</div><div class="bar ${pct(at(ww,i),at(wa,i))<85?'warn':''}"><i style="width:${pct(at(ww,i),at(wa,i))}%"></i></div></div>
   <div class="kc"><div class="nm">СПГУ + МПГУ: загрузка</div><div class="big num">${fmt(pct(sumU,nomU),0)}<small>% паспорта</small></div><div class="pl">${fmt(sumU)} из ${fmt(nomU)} т/сут · ${U.length} установок</div><div class="bar ${pct(sumU,nomU)<85?'warn':''}"><i style="width:${pct(sumU,nomU)}%"></i></div></div></div>
  <div class="card"><h3>Источники пара за сутки</h3><div class="sub">всего ${fmt(sum(parts.map(p=>p.v)))} т</div><div style="margin-top:8px">${hbars(parts.map(p=>({t:p.t,v:p.v,vt:fmt(p.v)+' т',vs:fmt(pct(p.v,sum(parts.map(x=>x.v))),0)+'%',c:p.c})))}</div></div>
  <div class="card"><h3>Закачка пара по дням</h3>${monthSelector('st',m)}${(()=>{const a=arr('steam',m),dp=D.series.steam.dayPlan[m]; return chart({labels:a.map((_,j)=>j+1),series:[{n:'Факт',c:C.violet,t:'bar',v:a,cf:v=>v<dp*.97?C.bad:C.violet},{n:'План',c:C.plan,t:'line',dash:1,v:a.map(()=>dp)}],h:220,tl:j=>`${j+1} ${MG[m-1]}`})})()}</div>
  <div class="card"><h3>Сухость пара, %</h3>${chart({labels:dry[0].v.map((_,j)=>j+1),series:dry,h:200,tl:j=>`${j+1} ${MG[m-1]}`,vf:v=>fmt(v,1)+'%'})}<div class="note">ППГ: ${fmt(at(ppg[1].v,i),1)}%, T пара ${fmt(at(ppg[2].v,i),0)}°C, P пара ${fmt(at(ppg[3].v,i),1)} атм · СПГУ: ${fmt(at(sp[1].v,i),1)}%, ${fmt(at(sp[3].v,i),1)} атм · МПГУ: ${fmt(at(mp[1].v,i),1)}%.</div></div>
  <div class="sec">Парогенераторы на ${D.meta.day} ${MG[M-1]} <span class="pill">срез сводки № 9</span></div>
  <div class="card" style="margin-top:8px"><h3>Состояние установок</h3><div class="sub">суточная закачка пара к паспортной (т/ч × 24)</div>
   <div class="lg" style="margin-top:8px"><span><i style="background:#bfe3d1"></i>≥90% — норма: ${cnt.ok}</span><span><i style="background:#f0d9a2"></i>70–90%: ${cnt.mid}</span><span><i style="background:#f3c3a8"></i>&lt;70%: ${cnt.low}</span><span><i style="background:#f2b9b0"></i>остановлен: ${cnt.off}</span></div>
   <div class="chips">${[['all','Все'],['bad','Проблемные'],['mpgu23','МПГУ-23т'],['spgu','СПГУ-18тн'],['mpgu11','МПГУ-11тн']].map(([a,b])=>`<button class="cp ${filt===a?'on':''}" data-uf="${a}">${b}</button>`).join('')}</div>
   <div class="ugrid">${shown.map(u=>{const r=u.steam?u.steam/u.nominal:0; return `<button class="u ${unitClass(u)}" data-u="${U.indexOf(u)}"><b>${u.name.replace('МПГУ-','М').replace('СПГУ-','С').replace(/\s+/g,' ').replace('тн. ','·').replace('т. ','·')}</b><div class="p num">${fmt(u.steam)}</div><div class="d">сух. ${u.dry?fmt(u.dry,0)+'%':'—'} · ${u.hours??'—'} ч</div><div class="bd"><i style="width:${Math.min(100,r*100)}%"></i></div></button>`}).join('')}</div>
   <div class="note">Нажмите установку — подробности. Паспорт: МПГУ-11тн — 264, МПГУ-23т — 552, СПГУ-18тн — 432 т/сут (расчёт по номинальной паропроизводительности).</div></div>
  <div class="card"><h3>Скважины ППГ в простое</h3>${chart({labels:(G['ППГ_stop'][m]||[])[0]?.v.map((_,j)=>j+1)||[],series:(G['ППГ_stop'][m]||[]).slice(1).map((r,j)=>({n:cleanL(r.l).replace('Остановлены на ',''),c:[C.bad,C.blue,C.plan][j],t:'line',v:r.v})),h:190,zero:0,tl:j=>`${j+1} ${MG[m-1]}`})}</div>`;
}
function showUnit(ix){ const u=D.today.units[ix]; const r=u.steam?u.steam/u.nominal:0;
  const note=[]; if(!u.steam) note.push('Нет закачки пара за сутки.'); if(u.steam&&!u.hours) note.push('Отработанные часы = 0 при ненулевой закачке — проверьте данные рапорта.'); if(u.dry&&u.dry<60) note.push('Сухость ниже 60% — пар влажный, эффективность прогрева снижена.');
  openSheet(`<h3 style="font-size:19px;margin:6px 34px 2px 0">${u.name}</h3><div class="sub mut">${u.where||''}</div>
  <div class="grid" style="margin-top:12px"><div class="kc"><div class="nm">Закачка пара</div><div class="big num">${fmt(u.steam)}<small>т/сут</small></div><div class="pl">паспорт ${u.nominal} т/сут · ${fmt(r*100,0)}%</div></div>
  <div class="kc"><div class="nm">Сухость</div><div class="big num">${u.dry?fmt(u.dry,1):'—'}<small>%</small></div></div><div class="kc"><div class="nm">Отработано</div><div class="big num">${u.hours??'—'}<small>ч</small></div></div></div>
  ${note.length?`<div class="card">${note.map(n=>`<div class="al w"><div class="ic">▲</div><div>${n}</div></div>`).join('')}</div>`:''}`); }

/* ======================= ЕЩЁ ======================= */
function vMore(){
  const T=D.today, M=curM(), i=S.day-1;
  const byOrg={}; T.krs.forEach(c=>{(byOrg[c.org.trim()]??=[]).push(c)}); const byR={}; T.krs.forEach(c=>{byR[c.reason]=(byR[c.reason]||0)+1});
  const rs=Object.entries(byR).sort((a,b)=>b[1]-a[1]);
  const ch=D.chem[M]||[]; const g=ch.filter(r=>/г\/т.*ЦППН\+ДНС|ЦППН\+ДНС.*г\/т/i.test(r.l)||/г\/т/i.test(r.l));
  const dem=ch.find(r=>/Всего\s+деэмульгатора\(|Всего деэмульгатора/i.test(r.l)&&at(r.v,i)), inh=ch.find(r=>/общий расход/i.test(r.l));
  const demG=ch.filter(r=>/г\/т/i.test(r.l)&&/ЦППН\+ДНС/i.test(r.l)).slice(-1)[0];
  const sw=T.swab;
  return `<div class="sec">КРС и ПРС · срез на ${D.meta.day} ${MG[M-1]}</div>
  <div class="grid"><div class="kc"><div class="nm">Бригад ПРС/КРС в работе</div><div class="big num">${T.krs.length}</div><div class="pl">ЦПКРС-1: ${(byOrg['ЦПКРС-1']||[]).length} · ЦПКРС-2: ${(byOrg['ЦПКРС-2']||[]).length} · БерАли: ${Object.entries(byOrg).filter(([k])=>/БерАли/.test(k)).reduce((s,[,v])=>s+v.length,0)}</div></div>
  <div class="kc"><div class="nm">Подъёмные установки</div><div class="big num">${T.pu.find(p=>/Итого/i.test(p.l))?.n??'—'}</div><div class="pl">переезд ${T.pu.find(p=>/Переезд/i.test(p.l))?.n??0} · ГТМ ${T.pu.find(p=>/ГТМ/i.test(p.l))?.n??0}</div></div></div>
  <div class="card"><h3>Причины остановки скважин в ремонте</h3><div style="margin-top:6px">${hbars(rs.map(([t,n])=>({t:t.charAt(0).toUpperCase()+t.slice(1),v:n,vt:n+' скв.'})))}</div></div>
  <div class="card"><h3>Бригады по скважинам</h3><div class="tw"><table><thead><tr><th>Бригада</th><th>Скв.</th><th>Установка</th><th>Причина</th></tr></thead><tbody>${T.krs.map((c,j)=>`<tr class="clk" data-kr="${j}"><td class="nm">${c.org.replace('«БерАли Мангистау Company»','БерАли')} · ${c.crew}</td><td class="num"><b>${c.well}</b></td><td>${c.rig}</td><td style="white-space:normal;text-align:left">${c.reason}</td></tr>`).join('')}</tbody></table></div><div class="note">Нажмите строку — план и выполненные работы (текст рапорта на казахском).</div></div>
  <div class="sec">Бурение</div>
  <div class="card" style="margin-top:8px"><div class="grid"><div class="kc" style="box-shadow:none"><div class="nm">Проходка с начала месяца</div><div class="big num">${fmt(T.drilling.mtdFact)}<small>м</small></div><div class="pl">план ${fmt(T.drilling.mtdPlan)} ${chip(T.drilling.mtdFact-T.drilling.mtdPlan,sgn(T.drilling.mtdFact-T.drilling.mtdPlan))}</div></div>
  <div class="kc" style="box-shadow:none"><div class="nm">Ввод скважин с нач. месяца</div><div class="big num">${T.drilling.wellsFactMtd}<small>из ${T.drilling.wellsPlanMtd}</small></div><div class="pl">за сутки: проходка ${fmt(T.drilling.dayFact)} м (план ${fmt(T.drilling.dayPlan,1)})</div></div></div>
  ${T.drillRigs.map(r=>`<div class="al i"><div class="ic">▲</div><div><b>${r.rig}</b> · ${r.contractor} · скв. ${r.well}${r.gzu?' ('+r.gzu+')':''}<div class="s">проектная глубина ${fmt(r.depth)} м · ${r.start}–${r.end} · с нач. месяца ${fmt(r.mtd)} м</div><div class="s">${r.work}</div></div></div>`).join('')}</div>
  <div class="sec">Свабирование (поршни)</div>
  <div class="card" style="margin-top:8px"><div class="sub">за сутки: жидкость ${fmt(sw.totLiq,1)} м³, нефть ${fmt(sw.totOil,1)} т</div><div class="tw"><table><thead><tr><th>Поршень</th><th>Скв.</th><th>ГЗУ</th><th>Жидк., м³</th><th>Нефть</th><th>Обв., %</th><th>Накоплено</th></tr></thead><tbody>${sw.rows.map(r=>`<tr><td class="nm">${r.n}</td><td class="num"><b>${r.well}</b></td><td>${r.gzu}</td><td class="num">${fmt(r.liq,1)}</td><td class="num">${fmt(r.oil,1)}</td><td class="num">${fmt(r.wc,1)}</td><td class="num">${fmt(r.cum,0)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="sec">Химреагенты</div>
  <div class="card" style="margin-top:8px"><h3>Расход на ${S.day} ${MG[M-1]}</h3><div class="tw"><table><thead><tr><th>Реагент</th><th>Сутки</th><th>Δ</th><th>Ср. мес.</th></tr></thead><tbody>${ch.filter(r=>at(r.v,i)!=null&&at(r.v,i)!==0).map(r=>{const v=at(r.v,i),p=at(r.v,i-1),av=sum(r.v)/Math.max(1,r.v.length); return `<tr><td class="nm">${cleanL(r.l)}</td><td class="num"><b>${fmt(v,v<500?1:0)}</b></td><td class="num ${v<p?'':'warn'}">${p!=null?sgn(v-p,v<500?1:0):'—'}</td><td class="num">${fmt(av,v<500?1:0)}</td></tr>`}).join('')}</tbody></table></div></div>
  <div class="sec">Техника и парк</div>
  <div class="card" style="margin-top:8px"><div class="tw"><table><thead><tr><th>Техника ГПУ</th><th>План</th><th>Факт</th><th>Откл.</th></tr></thead><tbody>${T.tech.rows.map(r=>`<tr><td class="nm">${r.l}</td><td class="num">${r.plan}</td><td class="num"><b>${r.fact}</b></td><td class="num ${r.dev<0?'bad':'good'}">${sgn(r.dev)}</td></tr>`).join('')}</tbody></table></div>
  <div class="note">По гаражам: ${T.tech.garage.map(r=>`${r.l} ${r.fact}/${r.plan} (${sgn(r.dev)})`).join(' · ')}. Причины отклонений: ${T.tech.reasons.filter(r=>r.v).map(r=>`${r.l} ${sgn(r.v)}`).join(', ')}.</div></div>
  <div class="card"><h3>Товарный парк и потери по актам</h3><div class="pl mut">Остаток в парке: <b class="num">${fmt(T.park.left)} т</b> · откачка РВС ${T.park.rvs||'—'}: ${T.park.note||'—'}</div>
  ${T.acts.map(a=>`<div class="al w"><div class="ic">▲</div><div><b>${a.cause}</b><div class="s">${a.wells} скв. · Qж ${a.q} м³ · Qн ${a.qn} т</div></div></div>`).join('')}</div>`;
}
function showKr(j){ const c=D.today.krs[j]; openSheet(`<h3 style="font-size:18px;margin:6px 34px 6px 0">Скв. ${c.well} · ${c.org}</h3><div class="sub mut">${c.crew} · ${c.rig} · причина: ${c.reason}</div>
 <div class="card"><h3>План работ</h3><div class="sub" style="font-size:13px;color:var(--ink);margin-top:6px">${c.plan||'—'}</div></div><div class="card"><h3>Выполнено за сутки</h3><div class="sub" style="font-size:13px;color:var(--ink);margin-top:6px">${c.done||'—'}</div></div><div class="note">Текст рапорта приведён как есть (казахский язык).</div>`); }

/* ======================= события ======================= */
function bindView(){
  const v=$('#view');
  v.querySelectorAll('[data-k]').forEach(e=>e.addEventListener('click',()=>showK(e.dataset.k)));
  v.querySelectorAll('[data-go]').forEach(e=>e.addEventListener('click',()=>{S.tab=e.dataset.go;render(true)}));
  v.querySelectorAll('[data-ms] button').forEach(b=>b.addEventListener('click',()=>{ const id=b.parentElement.dataset.ms; S.cm=S.cm||{}; const map={oilf:'oil'}; S.cm[map[id]||id]=+b.dataset.m; if(id==='oil'||id==='oilf')S.cm.oil=+b.dataset.m; const y=scrollY; render(); scrollTo(0,y); }));
  v.querySelectorAll('[data-ok]').forEach(b=>b.addEventListener('click',()=>{S.ok=b.dataset.ok;const y=scrollY;render();scrollTo(0,y)}));
  v.querySelectorAll('[data-ic]').forEach(b=>b.addEventListener('click',()=>{ const n=b.dataset.ic; S.ic=S.ic||['Ожидание ПРС','в ПРС','Периодические','Регулирование','Высокообводненные']; const ix=S.ic.findIndex(s=>n.toLowerCase().startsWith(s.toLowerCase())||s.toLowerCase().startsWith(n.toLowerCase())); if(ix>=0)S.ic.splice(ix,1); else S.ic.push(n); if(!S.ic.length)S.ic=[n]; const y=scrollY;render();scrollTo(0,y)}));
  v.querySelectorAll('[data-uf]').forEach(b=>b.addEventListener('click',()=>{S.uf=b.dataset.uf;const y=scrollY;render();scrollTo(0,y)}));
  v.querySelectorAll('[data-u]').forEach(b=>b.addEventListener('click',()=>showUnit(+b.dataset.u)));
  v.querySelectorAll('[data-kr]').forEach(b=>b.addEventListener('click',()=>showKr(+b.dataset.kr)));
}

/* ======================= запуск ======================= */
async function boot(){
  try{ const r=await fetch('data.json?'+Date.now()); D=await r.json(); }catch(e){ document.body.innerHTML='<div class="empty">Не удалось загрузить data.json</div>'; return; }
  const dd=D.meta.day; S.day=dd;
  $('#cvDate').textContent=`Сводка за ${dd} ${MG[D.meta.month-1]} ${D.meta.year}`;
  $('#cvK').innerHTML=['oil','sd','steam'].map(k=>{const x=K(k,dd); return `<div class="cv-k"><i>${x.name}</i><b class="num">${fmt(x.dayFact)}</b><small>${x.unit}</small></div>`}).join('');
  buildNav();
  $('#dPrev').onclick=()=>{ if(S.day>1){S.day--;render()} }; $('#dNext').onclick=()=>{ if(S.day<D.meta.day){S.day++;render()} };
  $('#bk').onclick=closeSheet; $('#shX').onclick=closeSheet;
  const go=()=>{ $('#app').hidden=false; $('#nav').hidden=false; render(true); $('#cover').classList.add('out'); setTimeout(()=>$('#cover').remove(),600); };
  $('#cvGo').onclick=go; $('#cover').addEventListener('dblclick',go);
  if(new URLSearchParams(location.search).has('skip')) go();
}
boot();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
