name: build
on:
  push:
    branches: [inbox]
  workflow_dispatch:
concurrency:
  group: build
  cancel-in-progress: true
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, path: site}
      - uses: actions/checkout@v4
        with: {ref: inbox, path: inbox}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install openpyxl
      - name: build
        working-directory: site
        run: python3 tools/build_all.py ../inbox/input .
      - name: commit
        working-directory: site
        run: |
          git config user.name "svodki-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json data version.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Данные обновлены автоматически"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
